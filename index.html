<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@portfolio:~</title>
    <!-- Fira Code Font for that coding feel -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #00ff41; /* Hacker Green */
            --cmd-color: #fce94f;
            --link-color: #34e2e2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fira Code', monospace;
            margin: 0;
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* The CRT Screen Effect (Scanlines) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .welcome-msg { margin-bottom: 20px; white-space: pre-wrap; }
        .command-line { display: flex; align-items: center; margin-top: 10px; }
        .prompt { color: var(--cmd-color); margin-right: 10px; }
        
        /* Input styling to look invisible */
        input {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }

        .output { margin-bottom: 10px; color: #ccc; }
        .output a { color: var(--link-color); text-decoration: none; border-bottom: 1px dashed var(--link-color); }
        .output a:hover { background: var(--link-color); color: black; }
        
        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: var(--text-color);
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            body { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div class="welcome-msg" id="banner"></div>
        <div id="history"></div>
        
        <div class="command-line">
            <span class="prompt">visitor@portfolio:~$</span>
            <input type="text" id="input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const config = {
            banner: `
  _    _      _ _         __          __        _     _ 
 | |  | |    | | |        \\ \\        / /       | |   | |
 | |__| | ___| | | ___     \\ \\  /\\  / /__  _  _| | __| |
 |  __  |/ _ \\ | |/ _ \\     \\ \\/  \\/ / _ \\| |/ / |/ _\` |
 | |  | |  __/ | | (_) |     \\  /\\  / (_) |  / | | (_| |
 |_|  |_|\\___|_|_|\\___/       \\/  \\/ \\___/|_|  \|_|\\__,_|
                                                        
 Welcome to my interactive portfolio.
 Type 'help' to see available commands.
            `,
            commands: {
                help: "Available commands: <br> - <span style='color:#fff'>whois</span>: About me <br> - <span style='color:#fff'>projects</span>: My coding projects <br> - <span style='color:#fff'>social</span>: Connect with me <br> - <span style='color:#fff'>clear</span>: Clear terminal",
                whois: "I am a Freelance Developer passionate about open source and cloud architecture.<br>I build things for the web using React, Node.js, and Cloudflare.",
                social: "Find me on the internet:<br>- <a href='https://github.com/ninjastrikers' target='_blank'>Facebook</a><br>- <a href='https://www.facebook.com/ninjastrikers' target='_blank'>GitHub</a><br>- <a href='https://twitter.com/ninjastrikers' target='_blank'>Twitter</a><br>- <a href='mailto:info@ninjastrikers.net'>Email</a>",
                projects: "Here are some of my recent builds:<br>1. <a href='https://sutaung.bar'>Sutaung.bar</a> - A digital sanctuary to share your hopes and dreams with the universe.<br>2. <a href='https://github.com/ninjastrikers/v2ray-configs'>V2Ray-Configs</a> - A fully automated V2Ray subscription aggregator.",
            }
        };

        const input = document.getElementById('input');
        const history = document.getElementById('history');
        const banner = document.getElementById('banner');

        // Initial Load
        banner.innerHTML = config.banner;

        // Focus input anywhere on click
        document.body.addEventListener('click', () => {
            input.focus();
        });

        // Command Handler
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = this.value.toLowerCase().trim();
                let output = "";

                if (cmd === 'clear') {
                    history.innerHTML = "";
                    this.value = "";
                    return;
                }

                if (config.commands[cmd]) {
                    output = config.commands[cmd];
                } else if (cmd !== "") {
                    output = `Command not found: ${cmd}. Type 'help' for a list of commands.`;
                }

                // Add to history
                if (cmd !== "") {
                    history.innerHTML += `<div><span class="prompt">visitor@portfolio:~$</span> ${cmd}</div>`;
                    history.innerHTML += `<div class="output">${output}</div>`;
                }
                
                // Clear input and scroll to bottom
                this.value = "";
                window.scrollTo(0, document.body.scrollHeight);
            }
        });
    </script>
</body>
</html>
